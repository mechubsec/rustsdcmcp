name: CI

on:
  # `push` is scoped to main. A bare `push:` fires on every branch, so a push
  # to a PR branch triggered this workflow twice -- once as `push`, once as
  # `pull_request`. The two carry different `github.ref` values, so the
  # concurrency group below did not collapse them and both ran to completion,
  # doubling Actions minutes for identical checks. Branch pushes are covered by
  # the `pull_request` event; main is covered here after merge.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Build, lint, and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # 1.98.0
      - name: Spec-drift script unit tests
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Every called SDC path exists in the vendored spec
        run: python3 scripts/spec-drift.py self-check
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --locked

  msrv:
    name: MSRV
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@b4f984c1e7daae8e175614de3e73a8411a20333c # 1.89.0
      - run: cargo +1.89 check --workspace --all-targets --locked

  docker-build:
    name: Docker image build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Build Docker image
        run: docker build --tag rustsdcmcp:ci .
      - name: Verify config paths survive operator overrides
        run: |
          # Regression guard for mecmcp#357: config paths must survive operator overrides.
          # Docker replaces CMD entirely when the caller supplies args, but appends to
          # ENTRYPOINT, so config paths must live in ENTRYPOINT or they vanish the
          # moment anyone passes --host.
          container_id=$(docker create rustsdcmcp:ci --host 0.0.0.0)
          argv=$(docker inspect "$container_id" --format '{{join .Args "\n"}}')
          docker rm "$container_id" > /dev/null

          echo "$argv" | grep -q -- '/etc/rustsdcmcp/sdc.json' || { echo "FAIL: --device-mapping path missing from argv with --host override"; exit 1; }
          echo "$argv" | grep -q -- '/var/lib/rustsdcmcp/tokens.json' || { echo "FAIL: --tokens-file path missing from argv with --host override"; exit 1; }
          echo "$argv" | grep -q -- '/var/lib/rustsdcmcp/audit-hmac.key' || { echo "FAIL: --audit-hmac-key-file path missing from argv with --host override"; exit 1; }
          echo "PASS: config paths survive --host override"
      - name: Verify the audit HMAC key is generated on first run (mecmcp#376 / MEC-978)
        run: |
          state_dir=$(mktemp -d)
          etc_dir=$(mktemp -d)
          cp examples/sdc.example.json "$etc_dir/sdc.json"
          echo '{"version":1,"tokens":[]}' > "$state_dir/tokens.json"
          # UID 65532 (the image's nonroot user) must be able to write the key
          # file into the mounted state volume.
          sudo chown -R 65532:65532 "$state_dir" "$etc_dir"
          # validate_endpoint() pins the config's host to
          # api.sdcloud.juniperclouds.net, so the endpoint can't be swapped
          # for a fake host without failing config validation before the key
          # is ever written. Instead keep the real host and black-hole it via
          # --add-host so the credential check against the live SDC API fails
          # fast (no network, placeholder token) -- the key file is
          # provisioned before that check runs, so its presence afterward is
          # what this asserts, not a clean startup.
          docker run --rm \
            --add-host api.sdcloud.juniperclouds.net:127.0.0.1 \
            -e SDC_API_TOKEN=placeholder \
            -v "$etc_dir:/etc/rustsdcmcp:ro" \
            -v "$state_dir:/var/lib/rustsdcmcp" \
            --user 65532:65532 \
            rustsdcmcp:ci || true
          # state_dir is owned by 65532:65532 mode 0700 (chowned above so the
          # container's nonroot user could write into it), so the runner user
          # needs sudo to stat back into it.
          sudo test -s "$state_dir/audit-hmac.key" || { echo "FAIL: audit-hmac.key was not generated"; exit 1; }
          echo "PASS: audit-hmac.key generated on first run"

  packaging:
    name: Package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - id: source
        name: Record exact source commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # 1.98.0
      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends shellcheck
      - name: Install Trivy 0.70.0
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.70.0
      - name: Shellcheck packaging scripts
        run: shellcheck scripts/build-package.sh scripts/verify-packaging.sh packaging/lxc/install.sh packaging/tests/package-smoke.sh
      - name: Verify packaging policy
        run: scripts/verify-packaging.sh
      - name: Build package
        run: scripts/build-package.sh
      - name: Smoke test package
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          artifact_dir="dist/$SOURCE_SHA"
          mapfile -t archives < <(find "$artifact_dir" -maxdepth 1 -type f -name 'rustsdcmcp_*_amd64.tar.gz' -print)
          test "${#archives[@]}" -eq 1
          archive="${archives[0]}"
          test -f "${archive}.sha256"
          test ! -L "$archive"
          test ! -L "${archive}.sha256"
          mapfile -t artifact_entries < <(find -P "$artifact_dir" -mindepth 1 -maxdepth 1 -printf '%f\t%y\n' | LC_ALL=C sort)
          test "${#artifact_entries[@]}" -eq 2
          test "${artifact_entries[0]}" = "$(basename -- "$archive")"$'\t'f
          test "${artifact_entries[1]}" = "$(basename -- "${archive}.sha256")"$'\t'f
          packaging/tests/package-smoke.sh "$archive"
      - name: Verify package metadata and SBOM
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          artifact_dir="dist/$SOURCE_SHA"
          mapfile -t archives < <(find "$artifact_dir" -maxdepth 1 -type f -name 'rustsdcmcp_*_amd64.tar.gz' -print)
          test "${#archives[@]}" -eq 1
          archive="${archives[0]}"
          mapfile -t build_infos < <(tar -tzf "$archive" | grep -E '/BUILD-INFO$')
          test "${#build_infos[@]}" -eq 1
          build_info="$(tar -xOf "$archive" "${build_infos[0]}")"
          printf '%s\n' "$build_info" | grep -Fx 'release_status=release'
          printf '%s\n' "$build_info" | grep -Fx "git_commit=$SOURCE_SHA"
          printf '%s\n' "$build_info" | awk -F= -v expected='mecmcp_ref=v0.26.0' '$1 == "mecmcp_ref" { count += 1; matches += ($0 == expected) } END { exit !(count == 1 && matches == 1) }'
          printf '%s\n' "$build_info" | grep -E '^glibc_floor=[0-9]+(\.[0-9]+)+$'
          mapfile -t sboms < <(tar -tzf "$archive" | grep -E '/SBOM\.cdx\.json$')
          test "${#sboms[@]}" -eq 1
          tar -xOf "$archive" "${sboms[0]}" | jq -e '
            .bomFormat == "CycloneDX"
            and (.metadata.component.name == "rustsdcmcp")
            and (.components | type == "array" and length > 0)
            and any(.components[]; .name == "serde")
            and (
              ([
                .components[]
                | select(.name? | strings | startswith("mecmcp-"))
                | [.name, .version]
              ] | sort)
              == [
                ["mecmcp-audit", "0.26.0"],
                ["mecmcp-auth", "0.26.0"],
                ["mecmcp-changeset", "0.26.0"],
                ["mecmcp-redact", "0.26.0"],
                ["mecmcp-runtime", "0.26.0"],
                ["mecmcp-secret", "0.26.0"],
                ["mecmcp-server", "0.26.0"],
                ["mecmcp-transport", "0.26.0"]
              ]
            )
            and (tostring | contains("v0.8.0") | not)
            and (tostring | contains("70ac3d8fb5f27db3257d11aef28bd09587f085e1") | not)
          ' >/dev/null
          ! tar -xOf "$archive" "${sboms[0]}" | grep -Fq "$GITHUB_WORKSPACE"
          ! tar -xOf "$archive" "${sboms[0]}" | grep -Eq '"/(home|workspace|workspaces)/'
      - name: Verify exact upload artifact set
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          artifact_dir="dist/$SOURCE_SHA"
          mapfile -t archives < <(find "$artifact_dir" -maxdepth 1 -type f -name 'rustsdcmcp_*_amd64.tar.gz' -print)
          test "${#archives[@]}" -eq 1
          archive="${archives[0]}"
          test -f "${archive}.sha256"
          test ! -L "$archive"
          test ! -L "${archive}.sha256"
          mapfile -t artifact_entries < <(find -P "$artifact_dir" -mindepth 1 -maxdepth 1 -printf '%f\t%y\n' | LC_ALL=C sort)
          test "${#artifact_entries[@]}" -eq 2
          test "${artifact_entries[0]}" = "$(basename -- "$archive")"$'\t'f
          test "${artifact_entries[1]}" = "$(basename -- "${archive}.sha256")"$'\t'f
      - name: Upload package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rustsdcmcp-${{ steps.source.outputs.sha }}
          path: dist/${{ steps.source.outputs.sha }}/*
          if-no-files-found: error
      - name: Verify skip-build provenance stays honest
        run: packaging/tests/skip-build-provenance.sh

  conformance:
    name: Package conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # 1.98.0
      - name: Install jq and realpath
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends jq coreutils
      - name: Install Trivy 0.70.0
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.70.0
      - name: Build package
        # Real build, not skip-build: the honest BUILD-INFO this stages is
        # what R3 checks, and only build-package.sh produces one.
        run: scripts/build-package.sh
      - name: Stage the package
        run: |
          set -euo pipefail
          commit=$(git rev-parse HEAD)
          mapfile -t archives < <(find "dist/$commit" -maxdepth 1 -type f -name 'rustsdcmcp_*_amd64.tar.gz')
          test "${#archives[@]}" -eq 1
          mkdir -p staging
          tar -xzf "${archives[0]}" -C staging --strip-components=1
          cp packaging/conformance.toml staging/
      - name: Build image
        run: docker build --tag rustsdcmcp:ci .
      - name: Conformance
        # Pinned past mecmcp v0.26.1 (unreleased on main) for mecmcp#492,
        # which teaches the manifest reader the audit_hmac_flag key this
        # repo's conformance.toml now sets. No tagged release contains it yet.
        uses: mechubsec/mecmcp/packaging/conformance@373dc51cac90b97e728e20363b4b05d7b2c179a5
        with:
          staging: staging
          manifest: staging/conformance.toml
          image: rustsdcmcp:ci
