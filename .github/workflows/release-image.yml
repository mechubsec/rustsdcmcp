name: Release container image

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    permissions:
      contents: read
      packages: write
      # Keyless cosign signing exchanges this job's OIDC token for a
      # short-lived Fulcio certificate; no key material is stored anywhere.
      # A reusable workflow's permissions can only be narrowed by the
      # caller, never widened, so this job must grant them itself -- see
      # mecmcp's docs/RELEASE-WORKFLOWS.md.
      id-token: write
    # mecmcp v0.27.0. reusable-release-image.yml is the same file as
    # 42989f6 (#501); this pin is the released tag, and the caller opts
    # into the Docker Hub inputs that file already declares.
    uses: mechubsec/mecmcp/.github/workflows/reusable-release-image.yml@19401120439cd1420701bb59b6495bfdd3718b93 # v0.27.0
    with:
      # GHCR requires a lowercase image path; github.repository is already lowercase.
      image: ghcr.io/${{ github.repository }}
      # Dual-push (mecmcp MEC-2110). Docker Hub org is `mechub`.
      # Docker Hub images are linux/amd64 only, so set platforms explicitly
      # (this is also the workflow default).
      dockerhub-image: docker.io/mechub/rustsdcmcp
      description: 'Security Director Cloud MCP server'
      platforms: linux/amd64
    secrets:
      dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
      dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}

  scan:
    name: Scan pushed image
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Trivy 0.70.0
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.70.0

      - name: Scan pushed image
        run: |
          trivy image --scanners vuln --exit-code 1 --ignore-unfixed \
            "ghcr.io/${{ github.repository }}@${{ needs.release.outputs.digest }}"
