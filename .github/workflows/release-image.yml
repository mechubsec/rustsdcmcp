name: Release container image

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    permissions:
      contents: read
      packages: write
      # Keyless cosign signing exchanges this job's OIDC token for a
      # short-lived Fulcio certificate; no key material is stored anywhere.
      # A reusable workflow's permissions can only be narrowed by the
      # caller, never widened, so this job must grant them itself -- see
      # mecmcp's docs/RELEASE-WORKFLOWS.md.
      id-token: write
    # Pinned past v0.26.1 to pick up #501 (max-mode provenance + SBOM
    # attestation on the pushed image); no mecmcp release past v0.26.1
    # exists yet, so this is an unreleased main commit, not a tag.
    uses: mechubsec/mecmcp/.github/workflows/reusable-release-image.yml@42989f693f5b73cf0a951d74881cdd22b02d6785 # main, post-v0.26.1 (#501)
    with:
      # GHCR requires a lowercase image path; github.repository is already lowercase.
      image: ghcr.io/${{ github.repository }}

  scan:
    name: Scan pushed image
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Trivy 0.70.0
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.70.0

      - name: Scan pushed image
        run: |
          trivy image --scanners vuln --exit-code 1 --ignore-unfixed \
            "ghcr.io/${{ github.repository }}@${{ needs.release.outputs.digest }}"
