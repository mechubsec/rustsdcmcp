name: Release container image

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    permissions:
      contents: read
      packages: write
      # Keyless cosign signing exchanges this job's OIDC token for a
      # short-lived Fulcio certificate; no key material is stored anywhere.
      # A reusable workflow's permissions can only be narrowed by the
      # caller, never widened, so this job must grant them itself -- see
      # mecmcp's docs/RELEASE-WORKFLOWS.md.
      id-token: write
    # mecmcp v0.28.2 (v0.28.1 plus an upload-artifact bump). The pin is the
    # released tag, and the caller opts into the Docker Hub inputs that file
    # already declares.
    uses: mechubsec/mecmcp/.github/workflows/reusable-release-image.yml@78f0b978cf67ca10547cce4c15111eb7a872d886 # v0.33.2
    with:
      # GHCR requires a lowercase image path; github.repository is already lowercase.
      image: ghcr.io/${{ github.repository }}
      # Dual-push (mecmcp MEC-2110). Docker Hub org is `mechub`.
      dockerhub-image: docker.io/mechub/rustsdcmcp
      description: 'Security Director Cloud MCP server'
    secrets:
      dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
      dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}

  scan:
    name: Scan pushed image
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Trivy 0.70.0
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.70.0

      - name: Scan pushed image
        # The digest is a multi-arch manifest list, so scan each platform.
        # --image-src remote: a local daemon copy would silently win over --platform.
        run: |
          for platform in linux/amd64 linux/arm64; do
            trivy image --image-src remote --platform "${platform}" --scanners vuln --exit-code 1 --ignore-unfixed \
              "ghcr.io/${{ github.repository }}@${{ needs.release.outputs.digest }}"
          done

  tag-version:
    name: Resolve tag version
    runs-on: ubuntu-24.04
    permissions: {}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Strip leading v from the pushed tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  registry-publish:
    name: Publish to MCP Registry
    needs: [release, tag-version]
    permissions:
      contents: read
      id-token: write
    uses: mechubsec/mecmcp/.github/workflows/reusable-registry-publish.yml@39e7308cda922dadad18a0b0a5775ec1ab4a0bca # v0.32.0
    with:
      version: ${{ needs.tag-version.outputs.version }}
      oci-image: ghcr.io/${{ github.repository }}:${{ needs.tag-version.outputs.version }}
