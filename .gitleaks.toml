title = "rustsdcmcp gitleaks config"

[extend]
path = ".gitleaks-vendor.toml"

# crates/rustsdcmcp-core/src/redact.rs's private_key_is_redacted test (added in
# 400327e, MEC-345) asserts redact_secrets() scrubs a private_key field. The
# fixture value is a synthetic, truncated PEM literal ("AAAA" body, no real
# key material) used only to trip the default private-key rule's denylist
# check; it is not a credential that ever touched a device. (mecmcp#392 dropped
# the redundant custom pem-private-key rule since the default private-key rule
# already covers all key types, so this allowlist now targets only that rule.)
[[allowlists]]
description = "Synthetic PEM literal in redact.rs private_key_is_redacted test (MEC-345), not a real key"
condition = "AND"
commits = ["400327e76226f72819616354d14d84e5b9e6153d"]
paths = [
  '''(^|/)crates/rustsdcmcp-core/src/redact\.rs$''',
]
targetRules = ["private-key"]

# projection.rs's iam_fields_outside_the_allowlist_are_dropped_from_users_and_roles
# test (MEC-224 Percy re-review) asserts the users/roles field allowlist drops a
# "$9$..." string from an unlisted field. The value is a synthetic literal typed
# directly into the test, not a $9$ hash captured from a real device or config.
# b8a9cae is the commit on the pre-squash MEC-224 feature branch; 28a3417 is the
# same change's hash after it landed on main via squash-merge (#200) — both are
# listed because different branches' histories reach one or the other.
[[allowlists]]
description = "Synthetic $9$-shaped literal in projection.rs users/roles allowlist test (MEC-224), not a real device secret"
condition = "AND"
commits = [
  "b8a9cae0ac144b51cbb9d19d2fd85c152920bcc4",
  "28a3417ae8dbf4806fb58f9fc49c62e73e8c7205",
]
paths = [
  '''(^|/)crates/rustsdcmcp-core/src/projection\.rs$''',
]
targetRules = ["junos-type9-secret"]

# redact.rs's config_diff_cli_text_session_words_survive_but_a_real_secret_is_redacted
# test (MEC-2519) asserts a Junos `set system root-authentication
# encrypted-password "$9$..."` statement in a CLI-format config_diff is still
# redacted even though sibling `session-init`/`session-close`/`limit-session`
# words in the same fixture must survive. The hash is a synthetic literal
# typed directly into the test, not a $9$ hash captured from a real device.
[[allowlists]]
description = "Synthetic $9$-shaped literal in redact.rs config_diff CLI-text test (MEC-2519), not a real device secret"
condition = "AND"
commits = ["c41321d3db3bbba2d44191596e574ea5c26b8775"]
paths = [
  '''(^|/)crates/rustsdcmcp-core/src/redact\.rs$''',
]
targetRules = ["junos-type9-secret"]
