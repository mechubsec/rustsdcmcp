title = "rustsdcmcp gitleaks config"

[extend]
path = ".gitleaks-vendor.toml"

# crates/rustsdcmcp-core/src/redact.rs has multiple tests (private_key_is_redacted,
# MEC-345; config_diff_cli_text_pem_block_is_redacted) that assert redact_secrets()
# scrubs PEM private-key bodies. The fixture value is a synthetic, truncated PEM
# body (repeated "A" characters, no real key material) used only to trip the
# default private-key rule's denylist check; it is not a credential that ever
# touched a device. Matched by content rather than by commit SHA/line, so this
# entry keeps covering the fixture across future edits to the file instead of
# breaking every time an unrelated change shifts this test's blame commit/line.
[[allowlists]]
description = "Synthetic PEM literal in redact.rs private-key tests (MEC-345), not a real key"
condition = "AND"
paths = [
  '''(^|/)crates/rustsdcmcp-core/src/redact\.rs$''',
]
regexes = [
  '''A{20,}''',
]
targetRules = ["private-key"]

# projection.rs's iam_fields_outside_the_allowlist_are_dropped_from_users_and_roles
# test (MEC-224 Percy re-review) asserts the users/roles field allowlist drops a
# "$9$..." string from an unlisted field. The value is a synthetic literal typed
# directly into the test, not a $9$ hash captured from a real device or config.
# b8a9cae is the commit on the pre-squash MEC-224 feature branch; 28a3417 is the
# same change's hash after it landed on main via squash-merge (#200) — both are
# listed because different branches' histories reach one or the other.
[[allowlists]]
description = "Synthetic $9$-shaped literal in projection.rs users/roles allowlist test (MEC-224), not a real device secret"
condition = "AND"
commits = [
  "b8a9cae0ac144b51cbb9d19d2fd85c152920bcc4",
  "28a3417ae8dbf4806fb58f9fc49c62e73e8c7205",
]
paths = [
  '''(^|/)crates/rustsdcmcp-core/src/projection\.rs$''',
]
targetRules = ["junos-type9-secret"]
