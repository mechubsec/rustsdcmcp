[package]
name = "rustsdcmcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
axum.workspace = true
axum-server.workspace = true
clap.workspace = true
http.workspace = true
rand.workspace = true
rmcp.workspace = true
rustls.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
rustsdcmcp-core = { version = "0.0.5", path = "../rustsdcmcp-core" }
mecmcp-audit.workspace = true
mecmcp-auth.workspace = true
mecmcp-changeset.workspace = true
mecmcp-runtime.workspace = true
mecmcp-secret.workspace = true
mecmcp-server.workspace = true
mecmcp-transport.workspace = true

[dev-dependencies]
reqwest.workspace = true
rustix = { version = "1", features = ["process"] }
tempfile = "3"
syn = { version = "3", features = ["full"] }
quote = "1"
toml = { version = "1.1", default-features = false, features = ["parse", "serde"] }
uuid.workspace = true
# Enables SdcClient::from_test_parts for handler-level tests that drive a
# real SdcHandler against a mock HTTP server instead of calling `page_list`
# directly (see MEC-2062 F4).
rustsdcmcp-core = { path = "../rustsdcmcp-core", features = ["test-support"] }

[lints]
workspace = true
