binary     = "bin/rustsdcmcp"
installer  = "packaging/lxc/install.sh"
service    = "rustsdcmcp"
config_dir = "/etc/rustsdcmcp"
tokens     = "/var/lib/rustsdcmcp/tokens.json"

# rustsdcmcp has a supported skip-build path (SDCMCP_PACKAGE_SKIP_BUILD) and
# its packager emits an honest BUILD-INFO either way -- a real rustc -vV when
# it compiled the binary, "unknown (...)" when it did not. R3 is therefore
# fatal rather than a warning. See mecmcp#355.
build_info     = true
skip_build_env = "SDCMCP_PACKAGE_SKIP_BUILD"

units = ["packaging/systemd/rustsdcmcp.service"]

# All three confirmed in CI (docker-build job) to survive an operator --host
# override: Docker replaces CMD wholesale but appends to ENTRYPOINT, and all
# three flags live in ENTRYPOINT.
must_survive_override = ["--device-mapping", "--tokens-file", "--audit-hmac-key-file"]

# The binary generates its own key when the file is absent and the image has
# no shell to run a key-generating entrypoint script, so this declares the
# audit_hmac_flag pattern instead of audit_entrypoint. Promotes conformance
# R7 from warn to fatal: the flag above is already in must_survive_override,
# so R6 proves it reaches the running container's argv.
audit_hmac_flag = "--audit-hmac-key-file"
